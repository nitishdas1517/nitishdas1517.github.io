      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t === "dark-mode") t = "dark";
        if (t === "light-mode") t = "light";
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
